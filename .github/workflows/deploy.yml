name: Deploy

on:
  workflow_run:
    workflows: ['CI']
    types:
      - completed
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Deploy to Oracle Cloud via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          passphrase: ${{ secrets.ORACLE_SSH_PASSPHRASE }}
          script: |
            export PATH=$PATH:$HOME/.nvm/versions/node/$(ls $HOME/.nvm/versions/node 2>/dev/null | tail -n 1)/bin:$HOME/.local/share/pnpm:$HOME/.pnpm-global/bin
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            cd ~/nifty-weekly-calendar-ratio-strangle
            git reset --hard
            git clean -fd
            git fetch origin master
            git reset --hard origin/master
            pnpm install --frozen-lockfile
            pnpm build
            pm2 restart ecosystem.config.cjs --env production
